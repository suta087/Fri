BcAGgABAAKABIAGgAiAQkAAwEcAO4BBwADARwA6gEFAAMBHADpAQQAAwEcAOgAAQAEAQYAAwEcAOkAAgAGAA4BCgADARwA7gEIAAMBHADqAAEABAELAAMBHADuAAEABAEMAAMBHADuAAEABQDnAOgA6QDrAO0ABgAAAAIACgAkAAMAAQAsAAEAEgAAAAEAAAAWAAEAAgABAG4AAwABABIAAQAcAAAAAQAAABYAAgABAOYA7wAAAAEAAgAiAJAAAQAAAAEACAACAA4ABADkAOUA5ADlAAEABAABACIAbgCQAAQAAAABAAgAAQAUAAEACAABAAQBSQADAJABFgABAAEAIAAEAAAAAQAIAAEAIgABAAgAAwAIAA4AFADhAAIAgwDiAAIAiwDjAAIAnQABAAEAgAABAAAAAQAIAAIA5AA0ADoAOwA8AD0APgA/AEAAQQBCAEMARABFAEYARwBIAEkASgBLAEwATQBOAE8AUABRAFIAUwCqAKsArACtAK4ArwCwALEAsgCzALQAtQC2ALcAuAC5ALoAuwC8AL0AvgC/AMAAwQDCAMMAAQAAAAEACAACAG4ANABUAFUAVgBXAFgAWQBaAFsAXABdAF4AXwBgAGEAYgBjAGQAZQBmAGcAaABpAGoAawBsAG0AxADFAMYAxwDIAMkAygDLAMwAzQDOAM8A0ADRANIA0wDUANUA1gDXANgA2QDaANsA3ADdAAEANAABAAkACgAMAA4AEwAUABUAFgAbABwAHQAfACAAIgApACsALAAtAC4ALwA0ADUANgA3ADkAbgB2AHcAeQB7AIAAgQCCAIMAiQCKAIsAjQCOAJAAlwCZAJoAmwCdAJ4AowCkAKUApgCpAAEAAQAIAAEAAAAUAAAAAAAAAAJ3Z2h0AQAAAA==) format('truetype');}

<body>
<canvas id="c" width="832" height="1476"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const mainCtx = cv.getContext('2d', { willReadFrequently: false });
  let ctx = mainCtx;
  const S = cv.width / 416;           // escala: coordenadas de diseño 416x738
  const W = 416, H = 738;
  const TAU = Math.PI * 2;
  const Q = new URLSearchParams(location.search);
  const STATIC = Q.has('t');
  const FULL = Q.has('full');
  const ONLY = Q.get('only');          // depuración: 'text' | 'flowers'

  // ───────────── Carta ─────────────
  const LETTER = [
`Ay, Frida...`,
`Hoy he querido regalarte algo diferente. Siempre te he relacionado con las rosas, con su delicadeza y elegancia, pero esta vez he elegido un girasol. ¿Y sabes por qué? Porque hay algo en ellos que me recuerda a ti, esa manera tan bonita de buscar la luz y abrir sus pétalos para mostrar toda su belleza.`,
`Así eres tú para mí, Frida. Tienes esa manera tan especial de iluminar mis días. A veces basta con un mensajito tuyo, saber cómo estás o recordar tu sonrisa para que mi día sea un poquito más bonito. Te has convertido en una de esas pequeñas cosas que espero con ilusión, como ese cafecito que acompaña mis noches de desvelo y que, después de tantas noches, uno termina extrañando cuando no está. Y así me pasa contigo, te extraño, quisiera tenerte cerquita, abrazarte, sentir tu calorcito y simplemente disfrutar de tu compañía.`,
`Y ahhh, tus ojos! No sabes cuánto me encantan. Son como dos zafiros que podría contemplar durante horas. Esa mirada tuya que me pone nervioso, tu sonrisa tan hermosa y esos cachetitos que me dan unas ganas inmensas de llenarlos de besitos. Me encanta tu dulzura, tu elegancia, tu manera de ser; eres una princesa, una dama tan distinguida y especial. No hay dos ni tres como tú, Frida, solamente hay una, y qué afortunado me siento de coincidir contigo.`,
`También quiero agradecerte por tu cariño, por tu ternura y por haberme querido incluso cuando ni yo mismo sabía quererme. Quizá no imaginas cuánto significa para mí. Quiero verte feliz, cumplir tus sueños, verte florecer y brillar siempre. Y si alguna vez llegan días nublados, quisiera poder acompañarte y recordarte lo maravillosa que eres.`,
`Quiero que sepas que cada canción que te dedico lleva un pedacito de lo que siento por ti. Aunque no toda su letra hable de amor, siempre encuentro palabras sobre extrañar, querer, cuidar, admirar y valorar que inevitablemente me recuerdan a ti.`,
`Y hoy, con este girasol, quiero recordarte algo: así como los girasoles buscan la luz para florecer, deseo que siempre encuentres motivos para sonreír y que nunca pierdas esa luz tan tuya. Porque me encanta verte brillar, Frida, y quisiera seguir descubriendo cada pequeño detalle que te hace ser tú.`,
`Si las rosas me recuerdan tu delicadeza, los girasoles me recuerdan esa luz tan bonita que encuentro en ti.`,
`Me encantas, Frida. Me encanta todo de ti, y si pudiera volver a elegir entre tantas flores, volvería a elegir aquella que me recuerda a ti.`,
  ];

  const FONT = 'CaveatEmb, Caveat, "Segoe Script", cursive';
  const TEXT_COLOR = '#f7e6a8';
  const GLOW = 'rgba(240,190,40,0.55)';
  const CPS = 38;                      // letras por segundo
  const START_DELAY = 1.6;             // s antes de empezar a escribir

  // RNG determinista para que la forma sea siempre la misma
  const rng = seed => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  // Paleta (facetas amarillas, centro café, hojas oliva)
  const YEL = ['#f7dd58', '#efca34', '#e1b624', '#d2a526', '#bf9426', '#a98424'];
  const LEAF = ['#8d8a45', '#6f7236', '#a29c52', '#5a5c2c'];

  const flowers = [
    { cx: 253, cy: 298, r: 70, rot: 0.2,  ph: 0.0, seed: 11 },
    { cx: 135, cy: 372, r: 68, rot: 0.9,  ph: 2.1, seed: 23 },
    { cx: 222, cy: 432, r: 76, rot: 0.5,  ph: 4.2, seed: 37 },
  ];
  const leaves = [
    { x: 118, y: 295, l: 40, a: 0.55,  ph: 0.3, seed: 5 },
    { x: 330, y: 362, l: 46, a: 2.55,  ph: 1.4, seed: 6 },
    { x: 300, y: 398, l: 36, a: 2.2,   ph: 2.6, seed: 7 },
    { x: 150, y: 492, l: 40, a: -2.5,  ph: 3.3, seed: 8 },
    { x: 296, y: 482, l: 40, a: -0.6,  ph: 4.6, seed: 9 },
    { x: 100, y: 436, l: 28, a: 3.5,   ph: 5.2, seed: 10 },
  ];

  function jag(pts, rand, amt) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      out.push(a);
      const n = 2;
      for (let k = 1; k <= n; k++) {
        const t = k / (n + 1);
        out.push([
          a[0] + (b[0] - a[0]) * t + (rand() - 0.5) * amt,
          a[1] + (b[1] - a[1]) * t + (rand() - 0.5) * amt,
        ]);
      }
    }
    return out;
  }

  function poly(pts, fill) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0] * S, pts[0][1] * S);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * S, pts[i][1] * S);
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function petal(len, wid, rand, shade) {
    const tip = [len, (rand() - 0.5) * wid * 0.3];
    const base = [
      [0, -wid * 0.28], [len * 0.35, -wid * 0.5], [len * 0.78, -wid * 0.36], tip,
      [len * 0.78, wid * 0.36], [len * 0.35, wid * 0.5], [0, wid * 0.28],
    ];
    const shape = jag(base, rand, wid * 0.18);
    return { shape, shade };
  }

  function drawFlower(f, t) {
    const rand = rng(f.seed);
    const breathe = 1 + Math.sin(t * 1.3 + f.ph) * 0.018;
    const sway = Math.sin(t * 0.7 + f.ph) * 0.05;
    ctx.save();
    ctx.translate(f.cx * S, f.cy * S);
    ctx.rotate(f.rot + sway);
    ctx.scale(breathe, breathe);
    ctx.translate(-f.cx * S, -f.cy * S);

    const layers = [
      { n: 17, len: f.r * 1.0,  wid: f.r * 0.42, off: 0.0,  tone: [3, 4, 5] },
      { n: 16, len: f.r * 0.92, wid: f.r * 0.40, off: 0.19, tone: [1, 2, 3] },
      { n: 14, len: f.r * 0.78, wid: f.r * 0.38, off: 0.11, tone: [0, 1, 2] },
    ];
    layers.forEach((L, li) => {
      for (let i = 0; i < L.n; i++) {
        const a = (i / L.n) * TAU + L.off + (rand() - 0.5) * 0.12;
        const flutter = Math.sin(t * 1.6 + i * 0.9 + f.ph + li) * 0.035;
        const len = L.len * (0.88 + rand() * 0.22);
        const p = petal(len, L.wid, rand);
        ctx.save();
        ctx.translate(f.cx * S, f.cy * S);
        ctx.rotate(a + flutter);
        ctx.translate(-f.cx * S, -f.cy * S);
        const ox = f.cx + f.r * 0.28;
        const pts = p.shape.map(q => [q[0] + ox, q[1] + f.cy]);
        const c = L.tone;
        poly(pts, YEL[c[1]]);
        const mid = pts.filter((_, k) => k < pts.length * 0.5);
        poly(mid.concat([[f.cx + f.r * 0.28 + len * 0.55, f.cy]]), YEL[c[0]]);
        const low = pts.filter((_, k) => k >= pts.length * 0.5);
        poly(low.concat([[f.cx + f.r * 0.28 + len * 0.5, f.cy]]), YEL[c[2]]);
        ctx.restore();
      }
    });

    const rr = rng(f.seed + 100);
    const cr = f.r * 0.42;
    const disc = (R, color, n, amt) => {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const a = (i / n) * TAU;
        const rad = R * (1 + (rr() - 0.5) * amt);
        pts.push([f.cx + Math.cos(a) * rad, f.cy + Math.sin(a) * rad]);
      }
      poly(pts, color);
    };
    disc(cr * 1.12, '#7a5a12', 26, 0.18);
    disc(cr,        '#5b4208', 24, 0.16);
    disc(cr * 0.72, '#7f6012', 22, 0.2);
    disc(cr * 0.46, '#4a3606', 18, 0.22);
    for (let i = 0; i < 26; i++) {
      const a = rr() * TAU, d = rr() * cr * 0.8;
      const sz = 1.2 + rr() * 2.2;
      poly([[f.cx + Math.cos(a) * d - sz, f.cy + Math.sin(a) * d],
            [f.cx + Math.cos(a) * d, f.cy + Math.sin(a) * d - sz],
            [f.cx + Math.cos(a) * d + sz, f.cy + Math.sin(a) * d],
            [f.cx + Math.cos(a) * d, f.cy + Math.sin(a) * d + sz]],
           rr() > 0.5 ? '#8c6c18' : '#3b2b05');
    }
    ctx.restore();
  }

  function drawLeaf(L, t) {
    const rand = rng(L.seed);
    const sw = Math.sin(t * 0.9 + L.ph) * 0.08;
    ctx.save();
    ctx.translate(L.x * S, L.y * S);
    ctx.rotate(L.a + sw);
    ctx.translate(-L.x * S, -L.y * S);
    const w = L.l * 0.42;
    const base = [[L.x, L.y], [L.x + L.l * 0.3, L.y - w], [L.x + L.l * 0.75, L.y - w * 0.7],
                  [L.x + L.l, L.y], [L.x + L.l * 0.75, L.y + w * 0.7], [L.x + L.l * 0.3, L.y + w]];
    const sh = jag(base, rand, w * 0.35);
    poly(sh, LEAF[1]);
    poly(sh.slice(0, Math.ceil(sh.length / 2)).concat([[L.x + L.l * 0.5, L.y]]), LEAF[2]);
    poly(sh.slice(Math.ceil(sh.length / 2)).concat([[L.x + L.l * 0.5, L.y]]), LEAF[3]);
    ctx.restore();
  }

  function drawScene(t) {
    ctx.save(); ctx.translate(7 * S, 1 * S);
    leaves.forEach(l => drawLeaf(l, t));
    flowers.forEach(f => drawFlower(f, t));
    ctx.restore();
  }

  // ───────────── Máscara del girasol (para rodearlo con texto) ─────────────
  // Se dibuja la escena fuera de pantalla en varias fases de la animación,
  // y por cada fila se guarda el intervalo [minX, maxX] que llega a ocupar.
  const rowMin = new Float32Array(H).fill(1e9);
  const rowMax = new Float32Array(H).fill(-1e9);
  function buildMask() {
    const oc = document.createElement('canvas');
    oc.width = cv.width; oc.height = cv.height;
    const octx = oc.getContext('2d', { willReadFrequently: true });
    const phases = [0, 0.9, 1.8, 2.7, 3.6, 4.5, 5.4, 6.3, 7.2, 8.1];
    ctx = octx;
    for (const t of phases) {
      octx.clearRect(0, 0, oc.width, oc.height);
      drawScene(t);
      const d = octx.getImageData(0, 0, oc.width, oc.height).data;
      for (let y = 0; y < oc.height; y++) {
        const r = Math.floor(y / S);
        for (let x = 0; x < oc.width; x++) {
          if (d[(y * oc.width + x) * 4 + 3] > 16) {
            const dx = x / S;
            if (dx < rowMin[r]) rowMin[r] = dx;
            if (dx > rowMax[r]) rowMax[r] = dx;
          }
        }
      }
    }
    ctx = mainCtx;
  }

  // ───────────── Composición del texto alrededor ─────────────
  const PAD = 15, MARGIN = 11, MIN_SEG = 40, TOP = 10, BOTTOM = 14;
  let LINES = [];   // {x, y, text, start, times[]}
  let TOTAL = 0, TIMES = null, FS = 0, OVERFLOW = false;

  function segmentsFor(y, fs) {
    const top = Math.max(0, Math.floor(y - fs * 0.85)), bot = Math.min(H - 1, Math.ceil(y + fs * 0.32));
    let mn = 1e9, mx = -1e9;
    for (let r = top; r <= bot; r++) { if (rowMin[r] < mn) mn = rowMin[r]; if (rowMax[r] > mx) mx = rowMax[r]; }
    if (mx < 0) return [{ x: PAD, w: W - 2 * PAD }];
    const segs = [];
    const lw = mn - MARGIN - PAD, rx = mx + MARGIN;
    if (lw >= MIN_SEG) segs.push({ x: PAD, w: lw });
    if (W - PAD - rx >= MIN_SEG) segs.push({ x: rx, w: W - PAD - rx });
    return segs;
  }

  function flow(fs) {
    ctx.font = `500 ${fs}px ${FONT}`;
    const lh = fs * 1.17;
    const lines = [];
    let y = TOP + fs;
    let segs = segmentsFor(y, fs), si = 0, cur = '', overflow = false;
    const nextBand = () => {
      y += lh; si = 0;
      if (y > H - BOTTOM) { overflow = true; return; }
      segs = segmentsFor(y, fs);
    };
    const flush = () => { if (cur) { lines.push({ x: segs[si].x, y, text: cur }); cur = ''; } };
    for (const para of LETTER) {
      const ws = para.split(' ');
      for (let wi = 0; wi < ws.length; wi++) {
        const word = ws[wi];
        while (!overflow) {
          const seg = segs[si];
          if (!seg) { nextBand(); continue; }
          // en columnas estrechas exige que quepan al menos dos palabras (evita "migajas" sueltas)
          if (cur === '' && seg.w < 70) {
            const need = ws[wi + 1] !== undefined ? word + ' ' + ws[wi + 1] : word;
            if (ctx.measureText(need).width > seg.w) { si++; continue; }
          }
          const trial = cur ? cur + ' ' + word : word;
          if (ctx.measureText(trial).width <= seg.w) { cur = trial; break; }
          flush(); si++;
        }
        if (overflow) break;
      }
      if (overflow) break;
      flush(); nextBand();
    }
    return { lines, overflow };
  }

  function layout() {
    let fs = 15, res;
    for (; fs >= 7; fs -= 0.25) { res = flow(fs); if (!res.overflow) break; }
    FS = fs; OVERFLOW = res.overflow; LINES = res.lines;
    // tiempos de aparición por letra
    TOTAL = 0; const times = [];
    let tcur = 0;
    for (const L of LINES) {
      L.start = TOTAL;
      for (let i = 0; i < L.text.length; i++) {
        times.push(tcur);
        const ch = L.text[i];
        tcur += 1 / CPS;
        if (ch === '.' || ch === '!' || ch === '?' || ch === ':') tcur += 0.42;
        else if (ch === ',' || ch === ';') tcur += 0.2;
      }
      tcur += 0.05; times.push(tcur); // el espacio/salto entre tramos
      TOTAL += L.text.length + 1;
    }
    TIMES = times;
    window.__layout = { lines_: LINES.map(l => [Math.round(l.x), Math.round(l.y), l.text.length, l.text.slice(0,18)]), fs: FS, lines: LINES.length, chars: TOTAL, overflow: OVERFLOW, duration: tcur };
  }

  function shownAt(el) {
    if (FULL) return TOTAL;
    if (el < 0) return 0;
    let lo = 0, hi = TIMES.length;
    while (lo < hi) { const m = (lo + hi) >> 1; if (TIMES[m] <= el) lo = m + 1; else hi = m; }
    return lo;
  }

  function drawText(el) {
    const shown = shownAt(el);
    if (!shown) return;
    ctx.save();
    ctx.font = `500 ${FS * S}px ${FONT}`;
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = TEXT_COLOR;
    ctx.shadowColor = GLOW; ctx.shadowBlur = 5 * S;
    let cursor = null;
    for (const L of LINES) {
      if (shown <= L.start) break;
      const n = Math.min(L.text.length, shown - L.start);
      const done = n === L.text.length && shown > L.start + L.text.length;
      if (!done) {
        // letra recién escrita aparece con fundido suave
        const head = L.text.slice(0, n - 1), ch = L.text[n - 1];
        ctx.globalAlpha = 1;
        ctx.fillText(head, L.x * S, L.y * S);
        const hw = ctx.measureText(head).width;
        const age = FULL ? 1 : Math.min(1, (el - TIMES[L.start + n - 1]) / 0.22);
        ctx.globalAlpha = Math.max(0.15, age);
        ctx.fillText(ch, L.x * S + hw, L.y * S);
        ctx.globalAlpha = 1;
        cursor = { x: L.x * S + hw + ctx.measureText(ch).width, y: L.y * S };
      } else {
        ctx.fillText(L.text, L.x * S, L.y * S);
        cursor = { x: L.x * S + ctx.measureText(L.text).width, y: L.y * S };
      }
    }
    if (cursor && !FULL && !STATIC) {
      const finished = shown >= TOTAL;
      const fade = finished ? Math.max(0, 1 - (el - TIMES[TIMES.length - 1] - 3) / 2) : 1;
      if (fade > 0 && Math.floor(el * 2.2) % 2 === 0) {
        ctx.shadowBlur = 0; ctx.globalAlpha = fade;
        ctx.fillStyle = '#f2c200';
        ctx.fillRect(cursor.x + 1.5 * S, cursor.y - FS * 0.8 * S, 1.4 * S, FS * 0.95 * S);
      }
    }
    ctx.restore();
  }

  // ───────────── Bucle ─────────────
  let T0 = null;
  function frame(ms) {
    if (T0 === null) T0 = ms;
    const t = ms / 1000;
    const el = STATIC ? Infinity : (ms - T0) / 1000 - START_DELAY;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    if (ONLY !== 'flowers') drawText(el);
    if (ONLY !== 'text') drawScene(t);
    if (!STATIC) requestAnimationFrame(frame);
  }

  async function init() {
    try { await document.fonts.load(`500 20px CaveatEmb`); await document.fonts.ready; } catch (e) {}
    buildMask();
    layout();
    if (STATIC) frame(parseFloat(Q.get('t')) * 1000);
    else requestAnimationFrame(frame);
    window.__ready = true;
  }
  init();
})();
</script>
</body>
</html>
